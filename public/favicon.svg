<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Base Container -->
  <rect width="32" height="32" rx="8" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />
  
  <!-- Outer Signal Radar Ring -->
  <circle cx="16" cy="16" r="10" fill="none" stroke="url(#ringGrad)" stroke-width="1.5" opacity="0.4" stroke-dasharray="2 3" />
  
  <!-- Inner Active Radar Ring -->
  <circle cx="16" cy="16" r="6.5" fill="none" stroke="#06b6d4" stroke-width="1.5" opacity="0.9" />
  
  <!-- Radar Scan Needle / Ray -->
  <line x1="16" y1="16" x2="23" y2="9" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" filter="url(#glow)" />
  
  <!-- Core Live Signal Dot -->
  <circle cx="16" cy="16" r="2.5" fill="#10b981" filter="url(#glow)" />
</svg>
